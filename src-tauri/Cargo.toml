[package]
name = "portwatch"
version = "2.0.0"
edition = "2021"

[lib]
name = "portwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
